<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AgustinDev</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0e0817;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 24px;
    }
    .logo {
      width: 72px;
      height: 72px;
      margin-bottom: 20px;
    }
    h1 {
      font-size: 24px;
      font-weight: 800;
      margin-bottom: 8px;
    }
    .status {
      font-size: 14px;
      color: rgba(255, 255, 255, 0.7);
      margin-bottom: 24px;
      max-width: 320px;
      line-height: 1.5;
    }
    .token-box {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 12px;
      font-size: 11px;
      font-family: monospace;
      color: #a78bfa;
      word-break: break-all;
      margin-bottom: 20px;
      max-width: 340px;
      display: none;
    }
    .btn {
      background: #7c3aed;
      color: #fff;
      border: none;
      padding: 12px 24px;
      font-size: 15px;
      font-weight: 700;
      border-radius: 10px;
      cursor: pointer;
      margin-bottom: 12px;
      width: 100%;
      max-width: 280px;
      text-decoration: none;
      display: inline-block;
    }
    .btn-secondary {
      background: rgba(255, 255, 255, 0.1);
      color: rgba(255, 255, 255, 0.8);
    }
    .spinner {
      width: 28px;
      height: 28px;
      border: 3px solid rgba(255, 255, 255, 0.1);
      border-top-color: #8b5cf6;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 16px auto;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <svg class="logo" viewBox="0 0 155 89" fill="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M77.4316 49.4968L70.7829 49.4969L55.2691 2.21685" stroke="#a78bfa" stroke-width="8" stroke-linecap="round" />
    <path d="M3.55859 54.6685L55.2724 2.21657" stroke="#a78bfa" stroke-width="8" stroke-linecap="round" />
    <line x1="2.21625" y1="-2.21625" x2="45.1255" y2="-2.21625" transform="matrix(-0.709987 -0.704215 -0.704215 0.709987 33.6113 88.6511)" stroke="#a78bfa" stroke-width="8" stroke-linecap="round" />
    <line x1="2.21625" y1="-2.21625" x2="26.5109" y2="-2.21625" transform="matrix(-0.710271 0.703929 0.703929 0.710271 54.0137 68.429)" stroke="#a78bfa" stroke-width="8" stroke-linecap="round" />
    <path d="M77.4316 49.4971L84.0804 49.4972L99.5942 2.2171" stroke="#a78bfa" stroke-width="8" stroke-linecap="round" />
    <path d="M151.305 54.6687L99.5909 2.21681" stroke="#a78bfa" stroke-width="8" stroke-linecap="round" />
    <line x1="121.263" y1="85.5169" x2="151.728" y2="55.2996" stroke="#a78bfa" stroke-width="8" stroke-linecap="round" />
  </svg>

  <h1>AgustinDev Admin</h1>
  <div class="spinner" id="spinner"></div>
  <p class="status" id="statusText">Conectando con el servidor en 192.168.1.14:3000...</p>
  <div class="token-box" id="tokenBox"></div>

  <a href="http://192.168.1.14:3000" class="btn" id="btnEnter">Entrar a la Web</a>
  <a href="http://192.168.1.14:3000/calendar" class="btn btn-secondary">Ver Agenda / Turnos</a>

  <script>
    const SERVER_URL = "http://192.168.1.14:3000";
    const statusText = document.getElementById("statusText");
    const tokenBox = document.getElementById("tokenBox");
    const spinner = document.getElementById("spinner");

    // 1. Inicializar Notificaciones Push directamente desde Capacitor
    async function setupPush() {
      if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.PushNotifications) {
        const Push = window.Capacitor.Plugins.PushNotifications;
        try {
          let perm = await Push.checkPermissions();
          if (perm.receive !== 'granted') {
            perm = await Push.requestPermissions();
          }

          if (perm.receive === 'granted') {
            await Push.register();

            Push.addListener('registration', async (token) => {
              tokenBox.style.display = "block";
              tokenBox.textContent = "Token FCM: " + token.value.substring(0, 24) + "... (Registrado)";
              statusText.textContent = "✅ Notificaciones activadas y teléfono registrado.";
              
              // Enviar token al backend
              try {
                await fetch(SERVER_URL + "/api/notifications/register", {
                  method: "POST",
                  headers: { "Content-Type": "application/json" },
                  body: JSON.stringify({ token: token.value, platform: "android" })
                });
              } catch(e) {
                console.warn("Error enviando token al backend:", e);
              }
            });

            Push.addListener('registrationError', (err) => {
              statusText.textContent = "⚠️ Error en registro push: " + JSON.stringify(err);
            });
          }
        } catch(e) {
          console.error("Error en setupPush:", e);
        }
      }
    }

    // 2. Intentar redirigir automáticamente al servidor local
    async function checkServerAndRedirect() {
      setupPush();
      
      try {
        const res = await fetch(SERVER_URL + "/api/notifications/test", { method: "HEAD", signal: AbortSignal.timeout(2500) });
        // Si el servidor local responde, redirigir a la web completa
        window.location.href = SERVER_URL;
      } catch (e) {
        spinner.style.display = "none";
        statusText.innerHTML = "No se pudo conectar automáticamente con <b>" + SERVER_URL + "</b>.<br>Asegúrate de que tu celular esté conectado a la misma red WiFi.";
      }
    }

    setTimeout(checkServerAndRedirect, 1000);
  </script>
</body>
</html>
