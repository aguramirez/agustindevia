<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AgustinDev</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0e0817;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 24px;
    }
    .logo {
      width: 72px;
      height: 72px;
      margin-bottom: 24px;
      animation: pulse 2s infinite ease-in-out;
    }
    h1 {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 8px;
    }
    p {
      color: rgba(255, 255, 255, 0.6);
      font-size: 14px;
      max-width: 280px;
      line-height: 1.5;
    }
    .spinner {
      margin-top: 32px;
      width: 28px;
      height: 28px;
      border: 3px solid rgba(255, 255, 255, 0.1);
      border-top-color: #8b5cf6;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.8; transform: scale(0.96); } }
  </style>
</head>
<body>
  <svg class="logo" viewBox="0 0 155 89" fill="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M77.4316 49.4968L70.7829 49.4969L55.2691 2.21685" stroke="#a78bfa" stroke-width="8" stroke-linecap="round" />
    <path d="M3.55859 54.6685L55.2724 2.21657" stroke="#a78bfa" stroke-width="8" stroke-linecap="round" />
    <line x1="2.21625" y1="-2.21625" x2="45.1255" y2="-2.21625" transform="matrix(-0.709987 -0.704215 -0.704215 0.709987 33.6113 88.6511)" stroke="#a78bfa" stroke-width="8" stroke-linecap="round" />
    <line x1="2.21625" y1="-2.21625" x2="26.5109" y2="-2.21625" transform="matrix(-0.710271 0.703929 0.703929 0.710271 54.0137 68.429)" stroke="#a78bfa" stroke-width="8" stroke-linecap="round" />
    <path d="M77.4316 49.4971L84.0804 49.4972L99.5942 2.2171" stroke="#a78bfa" stroke-width="8" stroke-linecap="round" />
    <path d="M151.305 54.6687L99.5909 2.21681" stroke="#a78bfa" stroke-width="8" stroke-linecap="round" />
    <line x1="121.263" y1="85.5169" x2="151.728" y2="55.2996" stroke="#a78bfa" stroke-width="8" stroke-linecap="round" />
  </svg>
  <h1>AgustinDev</h1>
  <p>Conectando con el servidor...</p>
  <div class="spinner"></div>
</body>
</html>
